[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrostrat-queued-pipeline"
version = "1.0.0"
description = "Queued source-text extraction with a local vLLM server"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.scripts]
macrostrat-extract = "kg_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["kg_pipeline*"]
