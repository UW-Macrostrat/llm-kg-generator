[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrostrat-simple-pipeline"
version = "0.1.0"
description = "Four-node LangGraph NER/RE pipeline with editable Pydantic constraints and detailed diagnostics"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2.10,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["kg_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
